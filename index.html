<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考场时钟 · 多功能版</title>
    <style>
        :root {
            --bg: #0b0b14;
            --time-color: #f0f0f5;
            --date-color: #b8b8c8;
            --label-color: #6b6b80;
            --colon-color: #8888a0;
            --btn-bg: rgba(255, 255, 255, 0.06);
            --btn-hover-bg: rgba(255, 255, 255, 0.14);
            --btn-text: #8888a0;
            --btn-hover-text: #c0c0d0;
            --divider: rgba(255, 255, 255, 0.08);
            --reminder-color: #7a7a8c;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-text: #c8c8d4;
            --menu-bg: rgba(30, 30, 45, 0.95);
            --menu-border: rgba(255, 255, 255, 0.15);
            --menu-text: #ccc;
            --menu-hover-bg: rgba(255, 255, 255, 0.1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:'PingFang SC','Microsoft YaHei',sans-serif; -webkit-font-smoothing:antialiased; user-select:none; cursor:default; }
        .top-reminder { position:fixed; top:clamp(12px,2.5vh,28px); left:50%; transform:translateX(-50%); font-size:clamp(0.9rem,2.2vw,1.4rem); color:var(--reminder-color); letter-spacing:0.06em; text-align:center; white-space:nowrap; opacity:0.75; transition:opacity 0.4s; z-index:5; pointer-events:none; }
        body.fullscreen-mode .top-reminder { opacity:0.9; }
        body.idle .top-reminder { opacity:0.65; transition:opacity 0.8s; }
        .clock-container { display:flex; flex-direction:column; align-items:center; width:100%; height:100%; padding:2vh 4vw 0; }
        .clock-display { display:flex; flex-direction:column; align-items:center; margin-top:clamp(4vh,8vh,10vh); flex-shrink:0; transition:margin-top 0.4s, font-size 0.4s; }
        body.image-mode .clock-display { margin-top:2vh; }
        body.image-mode .time-digit { font-size:clamp(3rem,10vw,10rem)!important; }
        body.image-mode .time-colon { font-size:clamp(2.5rem,8vw,8rem)!important; }
        body.image-mode .date-text, body.image-mode .weekday-text { font-size:clamp(1rem,3vw,1.8rem)!important; }
        .date-section { display:flex; align-items:center; gap:0.6em; margin-bottom:clamp(1.5vh,3vh,4vh); flex-wrap:wrap; }
        .date-text { font-size:clamp(1.4rem,4vw,2.6rem); color:var(--date-color); letter-spacing:0.04em; white-space:nowrap; }
        .weekday-text { font-size:clamp(1.4rem,4vw,2.6rem); color:#d0d0dc; letter-spacing:0.04em; white-space:nowrap; }
        .date-divider { width:1px; height:clamp(1.2rem,3.5vw,2.2rem); background:var(--divider); border-radius:1px; margin:0 0.3em; }
        .time-section { display:flex; align-items:center; gap:clamp(0.3em,1.5vw,0.8em); }
        .time-digit { font-size:clamp(5rem,16vw,18rem); font-weight:700; color:var(--time-color); letter-spacing:-0.02em; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 80px rgba(255,255,255,0.06); transition:font-size 0.4s; }
        .time-colon { font-size:clamp(4rem,14vw,16rem); font-weight:300; color:var(--colon-color); line-height:1; padding-bottom:clamp(0.3rem,1vh,1rem); animation:colonPulse 2s ease-in-out infinite; font-variant-numeric:tabular-nums; transition:font-size 0.4s; }
        @keyframes colonPulse { 0%,100%{ opacity:0.55; } 50%{ opacity:0.9; } }
        .info-section { margin-top:clamp(1vh,2vh,3vh); display:flex; align-items:center; gap:1em; }
        .timezone-label, .period-label { font-size:clamp(0.9rem,2vw,1.4rem); color:var(--label-color); letter-spacing:0.08em; }
        .info-dot { width:5px; height:5px; border-radius:50%; background:var(--label-color); opacity:0.5; }
        .sync-row { display:flex; align-items:center; gap:0.6em; margin-top:0.5em; }
        .sync-status { font-size:clamp(0.8rem,1.5vw,1rem); color:#8888a0; display:flex; align-items:center; gap:0.3em; opacity:0.8; }
        .sync-btn { background:none; border:1px solid rgba(255,255,255,0.15); border-radius:16px; color:#aaa; padding:0.2em 0.8em; font-size:clamp(0.7rem,1.3vw,0.85rem); cursor:pointer; display:flex; align-items:center; gap:0.25em; transition:0.3s; background:rgba(255,255,255,0.04); }
        .sync-btn:hover { color:#ddd; border-color:rgba(255,255,255,0.3); background:rgba(255,255,255,0.1); }

        .global-options {
            position: fixed;
            top: clamp(12px, 2.5vh, 28px);
            right: clamp(16px, 3vw, 32px);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .edit-timers-btn {
            display:flex; align-items:center; gap:0.4em; padding:0.5em 1.2em;
            background:var(--btn-bg); border:1px solid rgba(255,255,255,0.1); border-radius:2em;
            color:var(--btn-text); font-size:clamp(0.8rem,1.4vw,1rem); cursor:pointer;
            transition:0.3s; letter-spacing:0.04em; font-family:inherit; outline:none;
            backdrop-filter:blur(10px); white-space: nowrap;
        }
        .edit-timers-btn:hover { background:var(--btn-hover-bg); color:var(--btn-hover-text); border-color:rgba(255,255,255,0.25); transform:translateY(-1px); box-shadow:0 4px 20px rgba(0,0,0,0.3); }
        .menu-dropdown {
            position: absolute; top:110%; right:0;
            background:var(--menu-bg); border:1px solid var(--menu-border); border-radius:12px;
            padding:0.5em 0; min-width:220px; z-index:40; backdrop-filter:blur(20px);
            box-shadow:0 8px 30px rgba(0,0,0,0.5); display:none; flex-direction:column;
        }
        .menu-dropdown.show { display:flex; }
        .menu-item { padding:0.8em 1.5em; color:var(--menu-text); cursor:pointer; font-size:0.95rem; transition:background 0.2s; display:flex; align-items:center; gap:0.5em; white-space:nowrap; }
        .menu-item:hover { background:var(--menu-hover-bg); }
        .menu-item.active { color:#fff; font-weight:500; }

        .content-area { width:100%; max-width:1300px; margin-top:clamp(3vh,5vh,7vh); flex:1 1 auto; }
        .timers-grid, .random-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(0.8em,1.5vw,1.5em); }
        .timer-card, .random-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:1em; padding:clamp(0.8em,2vh,1.4em) clamp(0.6em,1.5vw,1em); text-align:center; display:flex; flex-direction:column; justify-content:center; transition:border-color 0.3s, background 0.3s; cursor:default; }
        .random-card { cursor:pointer; }
        .random-card:hover { background:rgba(255,255,255,0.08); }
        .timer-name, .random-name { font-size:clamp(1rem,2.2vw,1.8rem); font-weight:600; color:var(--card-text); letter-spacing:0.05em; margin-bottom:0.4em; white-space:nowrap; }
        .timer-time, .random-result { font-size:clamp(0.9rem,1.8vw,1.4rem); color:#a8a8ba; letter-spacing:0.04em; }
        body.editing .timer-card { border-color:rgba(255,255,255,0.18); background:rgba(255,255,255,0.06); }
        .start-time, .end-time { outline:none; border-radius:4px; padding:0.1em 0.3em; min-width:2.6em; display:inline-block; font-variant-numeric:tabular-nums; }
        .time-separator { opacity:0.7; }
        body.editing .timer-name[contenteditable="true"], body.editing .start-time[contenteditable="true"], body.editing .end-time[contenteditable="true"] { background:rgba(255,255,255,0.08); box-shadow:0 0 0 1px rgba(255,255,255,0.2); cursor:text; }
        body.editing .timer-name[contenteditable="true"]:focus, body.editing .start-time[contenteditable="true"]:focus, body.editing .end-time[contenteditable="true"]:focus { background:rgba(255,255,255,0.15); box-shadow:0 0 0 2px rgba(100,140,255,0.5); }

        .image-upload-wrapper { display:flex; flex-direction:column; align-items:center; gap:1em; }
        .image-upload-box {
            border:2px dashed rgba(255,255,255,0.2);
            border-radius:16px;
            padding:2em;
            text-align:center;
            color:#aaa;
            width:100%;
            max-width:600px;
            cursor:pointer;
            transition: border-color 0.3s;
        }
        .image-upload-box:hover { border-color: rgba(255,255,255,0.4); }
        .image-upload-box .upload-placeholder { display:flex; flex-direction:column; align-items:center; gap:0.5em; }
        .image-upload-box.has-image .upload-placeholder { display:none; }
        .image-upload-box img { max-width:100%; max-height:50vh; object-fit:contain; border-radius:8px; display:none; }
        .image-upload-box.has-image img { display:block; }

        .fullscreen-btn {
            position:fixed; bottom:clamp(16px,3vh,32px); right:clamp(16px,3vw,32px);
            display:flex; align-items:center; gap:0.5em; padding:0.7em 1.3em;
            background:var(--btn-bg); border:1px solid rgba(255,255,255,0.1); border-radius:2em;
            color:var(--btn-text); font-size:clamp(0.8rem,1.5vw,1rem); cursor:pointer;
            transition:0.3s; letter-spacing:0.05em; font-family:inherit; outline:none;
            backdrop-filter:blur(10px); z-index:10;
        }
        .fullscreen-btn:hover { background:var(--btn-hover-bg); color:var(--btn-hover-text); border-color:rgba(255,255,255,0.25); transform:translateY(-1px); box-shadow:0 4px 20px rgba(0,0,0,0.3); }
        .fullscreen-btn svg { width:clamp(14px,1.8vw,20px); height:clamp(14px,1.8vw,20px); flex-shrink:0; opacity:0.8; transition:opacity 0.3s; }
        .fullscreen-btn:hover svg { opacity:1; }
        body.fullscreen-mode .fullscreen-btn { opacity:0.4; background:rgba(255,255,255,0.03); border-color:rgba(255,255,255,0.06); }
        body.fullscreen-mode .fullscreen-btn:hover { opacity:0.9; background:var(--btn-hover-bg); border-color:rgba(255,255,255,0.25); }
        body.idle .fullscreen-btn, body.idle .edit-timers-btn { opacity:0.25; transition:opacity 0.8s; }
        body.idle .fullscreen-btn:hover, body.idle .edit-timers-btn:hover { opacity:0.9; }

        @media (max-width:900px) { .timers-grid, .random-grid { grid-template-columns:repeat(2,1fr); } }
        @media (max-width:600px) {
            .time-digit { font-size:clamp(3.5rem,22vw,7rem); }
            .time-colon { font-size:clamp(2.8rem,18vw,6rem); }
            .top-reminder { font-size:clamp(0.75rem,2.5vw,1rem); top:8px; white-space:normal; max-width:90vw; }
            .fullscreen-btn { bottom:12px; right:12px; padding:0.55em 1em; }
            .sync-row { flex-wrap:wrap; justify-content:center; }
            .global-options { top:8px; right:8px; }
        }
    </style>
</head>
<body>
    <div class="top-reminder">当你看到这句话时说明你该低头看自己卷子</div>

    <div class="global-options">
        <button class="edit-timers-btn" id="editTimersBtn">
            <span>⚙</span> <span>选项</span>
        </button>
        <div class="menu-dropdown" id="menuDropdown">
            <div class="menu-item" data-action="edit-timers">✎ 修改科目时间</div>
            <div class="menu-item" data-action="image-mode">🖼 隐藏定时器 · 展示图片</div>
            <div class="menu-item" data-action="random-draw">🎲 随机抽取</div>
        </div>
    </div>

    <div class="clock-container">
        <div class="clock-display">
            <div class="date-section">
                <span class="date-text" id="dateDisplay">----年--月--日</span>
                <span class="date-divider"></span>
                <span class="weekday-text" id="weekdayDisplay">---</span>
            </div>
            <div class="time-section">
                <span class="time-digit" id="hours">--</span><span class="time-colon">:</span>
                <span class="time-digit" id="minutes">--</span><span class="time-colon">:</span>
                <span class="time-digit" id="seconds">--</span>
            </div>
            <div class="info-section">
                <span class="timezone-label">北京时间</span><span class="info-dot"></span><span class="period-label" id="periodDisplay">--</span>
            </div>
            <div class="sync-row">
                <div class="sync-status"><span class="sync-dot" style="width:6px;height:6px;border-radius:50%;background:#aaa;display:inline-block;"></span><span id="syncText">等待网络校准…</span></div>
                <button class="sync-btn" id="manualSyncBtn">↻ 立即同步</button>
            </div>
        </div>

        <div class="content-area" id="contentArea">
            <div id="timersPanel" style="display:flex; flex-direction:column;">
                <div class="timers-grid" id="timersGrid"></div>
            </div>
            <div id="randomPanel" style="display:none;">
                <div class="random-grid" id="randomGrid"></div>
            </div>
            <div id="imagePanel" style="display:none;">
                <div class="image-upload-wrapper">
                    <div class="image-upload-box" id="imageUploadBox">
                        <div class="upload-placeholder">
                            <span style="font-size:2em;">📁</span>
                            <span>点击此处上传图片</span>
                            <span style="font-size:0.8em;opacity:0.7;">支持 JPG、PNG、GIF</span>
                        </div>
                        <img id="uploadedImage" alt="上传的图片" />
                        <input type="file" id="imageFileInput" accept="image/*" style="display:none;">
                    </div>
                    <button class="sync-btn" id="removeImageBtn" style="display:none;">移除图片</button>
                </div>
            </div>
        </div>
    </div>

    <button class="fullscreen-btn" id="fullscreenBtn" title="切换全屏 (F键)">
        <svg id="fsIconEnter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        <svg id="fsIconExit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="display:none;"><polyline points="4 8 4 3 9 3"/><polyline points="20 16 20 21 15 21"/><line x1="4" y1="3" x2="11" y2="10"/><line x1="20" y1="21" x2="13" y2="14"/></svg>
        <span id="fullscreenLabel">全屏</span>
    </button>

    <script>
        (function() {
            const hoursEl = document.getElementById('hours'), minutesEl = document.getElementById('minutes'), secondsEl = document.getElementById('seconds');
            const dateDisplayEl = document.getElementById('dateDisplay'), weekdayDisplayEl = document.getElementById('weekdayDisplay'), periodDisplayEl = document.getElementById('periodDisplay');
            const syncDot = document.querySelector('.sync-dot'), syncText = document.getElementById('syncText');
            const manualSyncBtn = document.getElementById('manualSyncBtn'), fullscreenBtn = document.getElementById('fullscreenBtn');
            const fsIconEnter = document.getElementById('fsIconEnter'), fsIconExit = document.getElementById('fsIconExit'), fullscreenLabel = document.getElementById('fullscreenLabel');
            const editTimersBtn = document.getElementById('editTimersBtn'), menuDropdown = document.getElementById('menuDropdown');
            const timersPanel = document.getElementById('timersPanel'), randomPanel = document.getElementById('randomPanel'), imagePanel = document.getElementById('imagePanel');
            const timersGrid = document.getElementById('timersGrid'), randomGrid = document.getElementById('randomGrid');
            const imageUploadBox = document.getElementById('imageUploadBox'), uploadedImage = document.getElementById('uploadedImage');
            const imageFileInput = document.getElementById('imageFileInput'), removeImageBtn = document.getElementById('removeImageBtn');
            const body = document.body;

            const WEEKDAY_NAMES = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
            const STORAGE_KEY = 'exam_timers', IMAGE_STORAGE_KEY = 'exam_image_data';
            const SYNC_INTERVAL = 120000;
            const TIME_APIS = [
                'https://worldtimeapi.org/api/timezone/Asia/Shanghai',
                'https://timeapi.io/api/Time/current/zone?timeZone=Asia/Shanghai',
                'https://api.allorigins.win/raw?url=http://worldtimeapi.org/api/timezone/Asia/Shanghai'
            ];
            const DEFAULT_TIMERS = [
                { name:'科目一', start:'08:00', end:'09:00' }, { name:'科目二', start:'09:15', end:'10:15' },
                { name:'科目三', start:'10:30', end:'11:30' }, { name:'科目四', start:'13:00', end:'14:00' },
                { name:'科目五', start:'14:15', end:'15:15' }, { name:'科目六', start:'15:30', end:'16:30' },
                { name:'科目七', start:'16:45', end:'17:45' }, { name:'科目八', start:'18:00', end:'19:00' }
            ];
            const GROUP_NAMES = [
                ['耿俪萌','王晨语','李鹤轩','李惜程','钟雨琦','王秋越'],
                ['徐浩轩','黄玥莹','邱紫桐','张瑜彤','方玺童','张睿哲'],
                ['赵轶涵','徐彦哲','赵一得','宋姝彤','李铭浩','崔梓轩'],
                ['付兆玉','左梓谦','陈浩铭','张晓玥','班瑞涵','张妙涵'],
                ['杨沛菡','张勤博','赵书钰','娄秉赫','苟喆祺','马靖轩'],
                ['王铭泽','商若熙','张智豪','武敬栩','王雯琦','李豪杰'],
                ['毕洛凡','张观程','马锦然','满家豪','田昊辰','程子濠'],
                ['孙振皓','蒋镇泽','叶皓轩','韩润杰','王煜瑄','李嘉轩']
            ];

            let isFullscreen = false, idleTimer = null, lastSecond = -1, currentTimers = [], serverTimeOffset = 0, syncTimer = null;
            let currentMode = 'normal', menuOpen = false, isTimeSynced = false;

            function padTwo(n){ return String(n).padStart(2,'0'); }
            function getPeriod(h){ if(h<6)return'凌晨';if(h<9)return'早晨';if(h<12)return'上午';if(h<14)return'中午';if(h<18)return'下午';if(h<20)return'傍晚';return'晚上'; }
            function getBeijingTime(){ return new Date(Date.now()+serverTimeOffset); }

            function updateSyncStatus(state,msg){
                syncText.textContent=msg||'';
                syncDot.style.background= state==='syncing'?'#ffaa00': state==='success'?'#4caf50': state==='failed'?'#ff5722':'#aaa';
            }

            async function tryFetchTime(url){
                const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),5000);
                try{
                    const r=await fetch(url,{signal:ctrl.signal,cache:'no-store'}); if(!r.ok)throw new Error('HTTP '+r.status);
                    const d=await r.json(); clearTimeout(t);
                    const dt=d.datetime||d.dateTime||(d.date&&d.time?d.date+'T'+d.time:null);
                    if(!dt)throw new Error('无时间字段');
                    return new Date(dt).getTime();
                }catch(e){ clearTimeout(t); throw e; }
            }

            async function syncNetworkTime(){
                updateSyncStatus('syncing','正在校准…'); let ok=false;
                for(const url of TIME_APIS){ try{ serverTimeOffset = await tryFetchTime(url) - Date.now(); isTimeSynced=true; updateSyncStatus('success','已网络校准 · 每2分钟同步'); ok=true; break; }catch(e){} }
                if(!ok){ if(isTimeSynced) updateSyncStatus('failed','同步失败，沿用上次'); else updateSyncStatus('failed','网络不可用，本地时间'); }
            }

            function startPeriodicSync(){ if(syncTimer)clearInterval(syncTimer); syncTimer=setInterval(syncNetworkTime,SYNC_INTERVAL); if(!isTimeSynced)syncNetworkTime(); }
            manualSyncBtn.addEventListener('click',(e)=>{ e.preventDefault(); syncNetworkTime(); });

            function updateClock(){
                const t=getBeijingTime(); const h=t.getHours(),m=t.getMinutes(),s=t.getSeconds();
                if(s===lastSecond){ requestAnimationFrame(()=>scheduleNextUpdate()); return; } lastSecond=s;
                hoursEl.textContent=padTwo(h); minutesEl.textContent=padTwo(m); secondsEl.textContent=padTwo(s);
                const ds=`${t.getFullYear()}年${t.getMonth()+1}月${t.getDate()}日`;
                if(dateDisplayEl.textContent!==ds){ dateDisplayEl.textContent=ds; weekdayDisplayEl.textContent=WEEKDAY_NAMES[t.getDay()]; periodDisplayEl.textContent=getPeriod(h); }
                requestAnimationFrame(()=>scheduleNextUpdate());
            }
            let updateTimeout;
            function scheduleNextUpdate(){ if(updateTimeout)clearTimeout(updateTimeout); const n=getBeijingTime(); updateTimeout=setTimeout(updateClock,1000-n.getMilliseconds()+1); }

            function loadTimers(){ try{ const s=localStorage.getItem(STORAGE_KEY); if(s){ const p=JSON.parse(s); if(Array.isArray(p)&&p.length===8)return p; } }catch(e){} return JSON.parse(JSON.stringify(DEFAULT_TIMERS)); }
            function saveTimers(){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(currentTimers)); }catch(e){} }
            function collectTimers(){ return Array.from(timersGrid.querySelectorAll('.timer-card')).map(c=>({ name:c.querySelector('.timer-name')?.textContent.trim()||'', start:c.querySelector('.start-time')?.textContent.trim()||'', end:c.querySelector('.end-time')?.textContent.trim()||'' })); }
            function renderTimers(timers){ currentTimers=timers; timersGrid.innerHTML=''; timers.forEach(t=>{ const card=document.createElement('div'); card.className='timer-card'; const n=document.createElement('span'); n.className='timer-name'; n.contentEditable='false'; n.textContent=t.name||'--'; const td=document.createElement('div'); td.className='timer-time'; const s=document.createElement('span'); s.className='start-time'; s.contentEditable='false'; s.textContent=t.start||'--:--'; const sep=document.createElement('span'); sep.className='time-separator'; sep.textContent='—'; const e=document.createElement('span'); e.className='end-time'; e.contentEditable='false'; e.textContent=t.end||'--:--'; td.append(s,sep,e); card.append(n,td); timersGrid.appendChild(card); }); attachBlur(); }
            function attachBlur(){ timersGrid.querySelectorAll('.timer-name,.start-time,.end-time').forEach(el=>{ el.removeEventListener('blur',handleBlur); el.addEventListener('blur',handleBlur); }); }
            function handleBlur(){ currentTimers=collectTimers(); saveTimers(); }
            function setEditable(ed){ timersGrid.querySelectorAll('.timer-name,.start-time,.end-time').forEach(el=>el.contentEditable=ed?'true':'false'); if(ed)body.classList.add('editing'); else body.classList.remove('editing'); attachBlur(); }

            function renderRandomGrid(){
                randomGrid.innerHTML='';
                for(let i=0;i<8;i++){
                    const card=document.createElement('div'); card.className='random-card'; card.dataset.group=i;
                    const name=document.createElement('div'); name.className='random-name'; name.textContent=`${i+1}组`;
                    const result=document.createElement('div'); result.className='random-result'; result.textContent='点击抽取';
                    card.append(name,result);
                    card.addEventListener('click',()=>drawRandom(i,card));
                    randomGrid.appendChild(card);
                }
            }

            function drawRandom(groupIndex,card){
                const names=GROUP_NAMES[groupIndex];
                const resultEl=card.querySelector('.random-result');
                function attempt(){
                    const r=Math.random();
                    if(r<0.9){ resultEl.textContent=names[Math.floor(r/0.15)]; }
                    else{ setTimeout(attempt,30); }
                }
                resultEl.textContent='抽取中…';
                attempt();
            }

            /* 核心切换：支持再次点击同一菜单项返回正常模式（锁定） */
            function switchMode(mode){
                // 如果点击的是当前已激活模式，则返回normal（锁定/退出图片/退出随机）
                if (mode === currentMode) {
                    if (mode === 'normal') return;
                    // 先执行退出当前模式的操作
                    if (currentMode === 'edit-timers') {
                        setEditable(false);
                        currentTimers = collectTimers();
                        saveTimers();
                    } else if (currentMode === 'image-mode') {
                        body.classList.remove('image-mode');
                    }
                    // 切换到normal
                    timersPanel.style.display = 'flex';
                    randomPanel.style.display = 'none';
                    imagePanel.style.display = 'none';
                    currentMode = 'normal';
                    updateMenuActive();
                    closeMenu();
                    return;
                }

                // 不同模式间的切换
                if (currentMode === 'edit-timers') {
                    setEditable(false);
                    currentTimers = collectTimers();
                    saveTimers();
                }
                if (currentMode === 'image-mode') body.classList.remove('image-mode');

                timersPanel.style.display = 'none';
                randomPanel.style.display = 'none';
                imagePanel.style.display = 'none';

                if (mode === 'normal' || mode === 'edit-timers') {
                    timersPanel.style.display = 'flex';
                    if (mode === 'edit-timers') setEditable(true);
                } else if (mode === 'image-mode') {
                    imagePanel.style.display = 'flex';
                    body.classList.add('image-mode');
                } else if (mode === 'random-draw') {
                    randomPanel.style.display = 'flex';
                }

                currentMode = mode;
                updateMenuActive();
                closeMenu();
            }

            function updateMenuActive(){
                menuDropdown.querySelectorAll('.menu-item').forEach(item => {
                    const action = item.dataset.action;
                    item.classList.toggle('active', action === currentMode);
                });
            }

            function toggleMenu(){ menuOpen?closeMenu():openMenu(); }
            function openMenu(){ menuDropdown.classList.add('show'); menuOpen=true; setTimeout(()=>document.addEventListener('click',handleClickOutside,{once:true}),10); }
            function closeMenu(){ menuDropdown.classList.remove('show'); menuOpen=false; }
            function handleClickOutside(e){ if(!editTimersBtn.contains(e.target)&&!menuDropdown.contains(e.target)) closeMenu(); }
            editTimersBtn.addEventListener('click',(e)=>{ e.stopPropagation(); toggleMenu(); });
            menuDropdown.addEventListener('click',(e)=>{
                const item = e.target.closest('.menu-item');
                if (item) switchMode(item.dataset.action);
            });

            // 图片上传
            imageUploadBox.addEventListener('click', (e) => { if(currentMode==='image-mode') imageFileInput.click(); });
            imageFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    uploadedImage.src = ev.target.result;
                    imageUploadBox.classList.add('has-image');
                    removeImageBtn.style.display = '';
                    try { localStorage.setItem(IMAGE_STORAGE_KEY, ev.target.result); } catch(e) {}
                };
                reader.readAsDataURL(file);
            });
            removeImageBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                uploadedImage.src = '';
                imageUploadBox.classList.remove('has-image');
                removeImageBtn.style.display = 'none';
                try { localStorage.removeItem(IMAGE_STORAGE_KEY); } catch(e) {}
            });
            function loadSavedImage(){
                try {
                    const saved = localStorage.getItem(IMAGE_STORAGE_KEY);
                    if (saved) { uploadedImage.src = saved; imageUploadBox.classList.add('has-image'); removeImageBtn.style.display = ''; }
                } catch(e) {}
            }

            // 全屏 (F键/按钮)
            function enterFullscreen(){ const el=document.documentElement; if(el.requestFullscreen)el.requestFullscreen().catch(()=>{}); else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen(); }
            function exitFullscreen(){ if(document.exitFullscreen)document.exitFullscreen().catch(()=>{}); else if(document.webkitExitFullscreen)document.webkitExitFullscreen(); }
            function toggleFullscreen(){ isFullscreen?exitFullscreen():enterFullscreen(); }
            function updateFullscreenUI(fs){ isFullscreen=fs; if(fs){ fsIconEnter.style.display='none'; fsIconExit.style.display='block'; fullscreenLabel.textContent='退出全屏'; body.classList.add('fullscreen-mode'); } else { fsIconEnter.style.display='block'; fsIconExit.style.display='none'; fullscreenLabel.textContent='全屏'; body.classList.remove('fullscreen-mode'); } }
            function onFullscreenChange(){ updateFullscreenUI(!!(document.fullscreenElement||document.webkitFullscreenElement)); }
            document.addEventListener('fullscreenchange',onFullscreenChange); document.addEventListener('webkitfullscreenchange',onFullscreenChange);
            fullscreenBtn.addEventListener('click',(e)=>{ e.preventDefault(); toggleFullscreen(); });
            document.addEventListener('keydown',(e)=>{ if((e.key==='f'||e.key==='F')&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ e.preventDefault(); toggleFullscreen(); } else if(e.key==='F11'){ e.preventDefault(); toggleFullscreen(); } });

            function resetIdle(){ body.classList.remove('idle'); if(idleTimer)clearTimeout(idleTimer); idleTimer=setTimeout(()=>body.classList.add('idle'),15000); }
            ['mousemove','touchstart','touchmove','keydown'].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));

            async function init(){
                renderTimers(loadTimers()); setEditable(false); renderRandomGrid(); loadSavedImage();
                timersPanel.style.display='flex'; randomPanel.style.display='none'; imagePanel.style.display='none';
                currentMode='normal';
                await syncNetworkTime(); startPeriodicSync();
                const t=getBeijingTime(); lastSecond=t.getSeconds();
                hoursEl.textContent=padTwo(t.getHours()); minutesEl.textContent=padTwo(t.getMinutes()); secondsEl.textContent=padTwo(lastSecond);
                dateDisplayEl.textContent=`${t.getFullYear()}年${t.getMonth()+1}月${t.getDate()}日`; weekdayDisplayEl.textContent=WEEKDAY_NAMES[t.getDay()]; periodDisplayEl.textContent=getPeriod(t.getHours());
                updateFullscreenUI(!!(document.fullscreenElement||document.webkitFullscreenElement)); resetIdle(); scheduleNextUpdate();
            }
            init();
            document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ if(updateTimeout)clearTimeout(updateTimeout); updateClock(); } });
        })();
    </script>
</body>
</html>
