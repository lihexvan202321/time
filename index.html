<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考场时钟 - 北京时间 (多源校准)</title>
    <style>
        :root {
            --bg: #0b0b14;
            --time-color: #f0f0f5;
            --date-color: #b8b8c8;
            --label-color: #6b6b80;
            --colon-color: #8888a0;
            --btn-bg: rgba(255, 255, 255, 0.06);
            --btn-hover-bg: rgba(255, 255, 255, 0.14);
            --btn-text: #8888a0;
            --btn-hover-text: #c0c0d0;
            --divider: rgba(255, 255, 255, 0.08);
            --reminder-color: #7a7a8c;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-text: #c8c8d4;
            --card-label: #6b6b80;
            --edit-active-border: rgba(100, 140, 255, 0.5);
            --sync-status: #8888a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
        }

        .top-reminder {
            position: fixed;
            top: clamp(12px, 2.5vh, 28px);
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(0.9rem, 2.2vw, 1.4rem);
            font-weight: 400;
            color: var(--reminder-color);
            letter-spacing: 0.06em;
            text-align: center;
            white-space: nowrap;
            opacity: 0.75;
            transition: opacity 0.4s ease;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        body.fullscreen-mode .top-reminder { opacity: 0.9; }
        body.idle .top-reminder { opacity: 0.65; transition: opacity 0.8s ease; }

        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 2vh 4vw 0;
            position: relative;
        }

        .clock-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: clamp(4vh, 8vh, 10vh);
            flex-shrink: 0;
        }

        .date-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6em;
            margin-bottom: clamp(1.5vh, 3vh, 4vh);
            flex-wrap: wrap;
        }

        .date-text {
            font-size: clamp(1.4rem, 4vw, 2.6rem);
            font-weight: 400;
            color: var(--date-color);
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        .weekday-text {
            font-size: clamp(1.4rem, 4vw, 2.6rem);
            font-weight: 500;
            color: #d0d0dc;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        .date-divider {
            width: 1px;
            height: clamp(1.2rem, 3.5vw, 2.2rem);
            background: var(--divider);
            border-radius: 1px;
            margin: 0 0.3em;
        }

        .time-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(0.3em, 1.5vw, 0.8em);
        }

        .time-digit {
            font-size: clamp(5rem, 16vw, 18rem);
            font-weight: 700;
            color: var(--time-color);
            letter-spacing: -0.02em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
            text-shadow: 0 0 80px rgba(255, 255, 255, 0.06);
        }

        .time-colon {
            font-size: clamp(4rem, 14vw, 16rem);
            font-weight: 300;
            color: var(--colon-color);
            line-height: 1;
            padding-bottom: clamp(0.3rem, 1vh, 1rem);
            animation: colonPulse 2s ease-in-out infinite;
            font-variant-numeric: tabular-nums;
        }

        @keyframes colonPulse {
            0%, 100% { opacity: 0.55; }
            50% { opacity: 0.9; }
        }

        .info-section {
            margin-top: clamp(1vh, 2vh, 3vh);
            display: flex;
            align-items: center;
            gap: 1em;
        }

        .timezone-label {
            font-size: clamp(0.9rem, 2vw, 1.4rem);
            color: var(--label-color);
            letter-spacing: 0.08em;
            font-weight: 400;
        }

        .info-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--label-color);
            opacity: 0.5;
        }

        .period-label {
            font-size: clamp(0.9rem, 2vw, 1.4rem);
            color: var(--label-color);
            letter-spacing: 0.06em;
            font-weight: 400;
        }

        .sync-row {
            display: flex;
            align-items: center;
            gap: 0.6em;
            margin-top: 0.5em;
        }

        .sync-status {
            font-size: clamp(0.8rem, 1.5vw, 1rem);
            color: var(--sync-status);
            display: flex;
            align-items: center;
            gap: 0.3em;
            opacity: 0.8;
            transition: opacity 0.4s;
        }

        .sync-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            color: #aaa;
            padding: 0.2em 0.8em;
            font-size: clamp(0.7rem, 1.3vw, 0.85rem);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.25em;
            transition: all 0.3s;
            background: rgba(255,255,255,0.04);
        }

        .sync-btn:hover {
            color: #ddd;
            border-color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
        }

        .timers-section {
            width: 100%;
            max-width: 1300px;
            margin-top: clamp(3vh, 5vh, 7vh);
            margin-bottom: clamp(2vh, 3vh, 5vh);
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
        }

        .timers-toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1.2em;
            padding: 0 0.4em;
        }

        .edit-timers-btn {
            display: flex;
            align-items: center;
            gap: 0.4em;
            padding: 0.5em 1.2em;
            background: var(--btn-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 2em;
            color: var(--btn-text);
            font-size: clamp(0.8rem, 1.4vw, 1rem);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.04em;
            font-family: inherit;
            outline: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .edit-timers-btn:hover {
            background: var(--btn-hover-bg);
            color: var(--btn-hover-text);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .edit-timers-btn:active { transform: scale(0.96); transition: transform 0.1s; }

        .timers-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(0.8em, 1.5vw, 1.5em);
            width: 100%;
        }

        .timer-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1em;
            padding: clamp(0.8em, 2vh, 1.4em) clamp(0.6em, 1.5vw, 1em);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: border-color 0.3s, background 0.3s;
        }

        body.editing .timer-card {
            border-color: rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.06);
        }

        .timer-name {
            font-size: clamp(1rem, 2.2vw, 1.8rem);
            font-weight: 600;
            color: var(--card-text);
            letter-spacing: 0.05em;
            margin-bottom: 0.4em;
            white-space: nowrap;
            outline: none;
            border-radius: 4px;
            padding: 0.1em 0.3em;
            transition: background 0.2s, box-shadow 0.2s;
            min-width: 3em;
            display: inline-block;
            margin-left: auto;
            margin-right: auto;
        }

        .timer-time {
            font-size: clamp(0.9rem, 1.8vw, 1.4rem);
            font-weight: 400;
            color: #a8a8ba;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3em;
            flex-wrap: wrap;
        }

        .start-time, .end-time {
            outline: none;
            border-radius: 4px;
            padding: 0.1em 0.3em;
            transition: background 0.2s, box-shadow 0.2s;
            min-width: 2.6em;
            display: inline-block;
            font-variant-numeric: tabular-nums;
        }

        .time-separator { opacity: 0.7; }

        body.editing .timer-name[contenteditable="true"],
        body.editing .start-time[contenteditable="true"],
        body.editing .end-time[contenteditable="true"] {
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.2);
            cursor: text;
        }

        body.editing .timer-name[contenteditable="true"]:focus,
        body.editing .start-time[contenteditable="true"]:focus,
        body.editing .end-time[contenteditable="true"]:focus {
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 0 2px var(--edit-active-border);
        }

        .fullscreen-btn {
            position: fixed;
            bottom: clamp(16px, 3vh, 32px);
            right: clamp(16px, 3vw, 32px);
            display: flex;
            align-items: center;
            gap: 0.5em;
            padding: 0.7em 1.3em;
            background: var(--btn-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 2em;
            color: var(--btn-text);
            font-size: clamp(0.8rem, 1.5vw, 1rem);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
            font-family: inherit;
            outline: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
        }

        .fullscreen-btn:hover {
            background: var(--btn-hover-bg);
            color: var(--btn-hover-text);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .fullscreen-btn svg {
            width: clamp(14px, 1.8vw, 20px);
            height: clamp(14px, 1.8vw, 20px);
            flex-shrink: 0;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .fullscreen-btn:hover svg { opacity: 1; }

        body.fullscreen-mode .fullscreen-btn { opacity: 0.4; background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.06); }
        body.fullscreen-mode .fullscreen-btn:hover { opacity: 0.9; background: var(--btn-hover-bg); border-color: rgba(255,255,255,0.25); }

        body.idle .fullscreen-btn, body.idle .edit-timers-btn { opacity: 0.25; transition: opacity 0.8s ease; }
        body.idle .fullscreen-btn:hover, body.idle .edit-timers-btn:hover { opacity: 0.9; }

        @media (max-width: 900px) {
            .timers-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8em; }
        }

        @media (max-width: 600px) {
            .time-digit { font-size: clamp(3.5rem, 22vw, 7rem); }
            .time-colon { font-size: clamp(2.8rem, 18vw, 6rem); }
            .top-reminder { font-size: clamp(0.75rem, 2.5vw, 1rem); top: 8px; white-space: normal; max-width: 90vw; }
            .timers-grid { gap: 0.6em; }
            .fullscreen-btn { bottom: 12px; right: 12px; padding: 0.55em 1em; }
            .edit-timers-btn { padding: 0.4em 0.9em; font-size: 0.8rem; }
            .sync-row { flex-wrap: wrap; justify-content: center; }
        }

        @media (max-width: 380px) {
            .time-digit { font-size: clamp(2.8rem, 20vw, 5rem); }
            .top-reminder { font-size: 0.7rem; top: 5px; }
            .fullscreen-btn span { display: none; }
            .fullscreen-btn { padding: 0.55em 0.7em; border-radius: 50%; }
            .timers-grid { gap: 0.4em; }
        }
    </style>
</head>
<body>
    <div class="top-reminder">当你看到这句话时说明你该低头看自己卷子</div>

    <div class="clock-container">
        <div class="clock-display">
            <div class="date-section">
                <span class="date-text" id="dateDisplay">----年--月--日</span>
                <span class="date-divider"></span>
                <span class="weekday-text" id="weekdayDisplay">---</span>
            </div>
            <div class="time-section">
                <span class="time-digit" id="hours">--</span>
                <span class="time-colon">:</span>
                <span class="time-digit" id="minutes">--</span>
                <span class="time-colon">:</span>
                <span class="time-digit" id="seconds">--</span>
            </div>
            <div class="info-section">
                <span class="timezone-label">北京时间</span>
                <span class="info-dot"></span>
                <span class="period-label" id="periodDisplay">--</span>
            </div>
            <div class="sync-row">
                <div class="sync-status" id="syncStatus">
                    <span class="sync-dot" style="width:6px;height:6px;border-radius:50%;background:#aaa;display:inline-block;"></span>
                    <span id="syncText">等待网络校准…</span>
                </div>
                <button class="sync-btn" id="manualSyncBtn" title="立即同步网络时间">
                    <span>↻</span> 立即同步
                </button>
            </div>
        </div>

        <div class="timers-section">
            <div class="timers-toolbar">
                <button class="edit-timers-btn" id="editTimersBtn">
                    <span id="editIcon">✎</span>
                    <span id="editLabel">编辑</span>
                </button>
            </div>
            <div class="timers-grid" id="timersGrid"></div>
        </div>
    </div>

    <button class="fullscreen-btn" id="fullscreenBtn" title="切换全屏">
        <svg id="fsIconEnter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        <svg id="fsIconExit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="display:none;"><polyline points="4 8 4 3 9 3"/><polyline points="20 16 20 21 15 21"/><line x1="4" y1="3" x2="11" y2="10"/><line x1="20" y1="21" x2="13" y2="14"/></svg>
        <span id="fullscreenLabel">全屏</span>
    </button>

    <script>
        (function() {
            // DOM元素
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const dateDisplayEl = document.getElementById('dateDisplay');
            const weekdayDisplayEl = document.getElementById('weekdayDisplay');
            const periodDisplayEl = document.getElementById('periodDisplay');
            const syncStatusDot = document.querySelector('.sync-dot');
            const syncText = document.getElementById('syncText');
            const manualSyncBtn = document.getElementById('manualSyncBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const fullscreenLabel = document.getElementById('fullscreenLabel');
            const fsIconEnter = document.getElementById('fsIconEnter');
            const fsIconExit = document.getElementById('fsIconExit');
            const timersGrid = document.getElementById('timersGrid');
            const editTimersBtn = document.getElementById('editTimersBtn');
            const editIcon = document.getElementById('editIcon');
            const editLabel = document.getElementById('editLabel');
            const body = document.body;

            const WEEKDAY_NAMES = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
            const STORAGE_KEY = 'exam_timers';
            const SYNC_INTERVAL = 120000;

            // 多个时间API源（依次尝试）
            const TIME_APIS = [
                'https://worldtimeapi.org/api/timezone/Asia/Shanghai',
                'https://timeapi.io/api/Time/current/zone?timeZone=Asia/Shanghai',
                'https://api.allorigins.win/raw?url=http://worldtimeapi.org/api/timezone/Asia/Shanghai'
            ];

            const DEFAULT_TIMERS = [
                { name: '科目一', start: '08:00', end: '09:00' },
                { name: '科目二', start: '09:15', end: '10:15' },
                { name: '科目三', start: '10:30', end: '11:30' },
                { name: '科目四', start: '13:00', end: '14:00' },
                { name: '科目五', start: '14:15', end: '15:15' },
                { name: '科目六', start: '15:30', end: '16:30' },
                { name: '科目七', start: '16:45', end: '17:45' },
                { name: '科目八', start: '18:00', end: '19:00' }
            ];

            let isFullscreen = false;
            let isEditingTimers = false;
            let idleTimer = null;
            let lastSecond = -1;
            let currentTimers = [];
            let serverTimeOffset = 0;
            let syncTimer = null;
            let isTimeSynced = false;

            function padTwo(num) { return String(num).padStart(2, '0'); }

            function getPeriod(hours) {
                if (hours >= 0 && hours < 6) return '凌晨';
                if (hours >= 6 && hours < 9) return '早晨';
                if (hours >= 9 && hours < 12) return '上午';
                if (hours >= 12 && hours < 14) return '中午';
                if (hours >= 14 && hours < 18) return '下午';
                if (hours >= 18 && hours < 20) return '傍晚';
                return '晚上';
            }

            function getBeijingTime() {
                return new Date(Date.now() + serverTimeOffset);
            }

            function updateSyncStatus(state, msg) {
                syncText.textContent = msg || '未知状态';
                switch(state) {
                    case 'syncing':
                        syncStatusDot.style.background = '#ffaa00';
                        break;
                    case 'success':
                        syncStatusDot.style.background = '#4caf50';
                        break;
                    case 'failed':
                        syncStatusDot.style.background = '#ff5722';
                        break;
                    default:
                        syncStatusDot.style.background = '#aaa';
                }
            }

            async function tryFetchTime(url) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5000);
                try {
                    const resp = await fetch(url, { signal: controller.signal, cache: 'no-store' });
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    const data = await resp.json();
                    clearTimeout(timeout);
                    // 解析不同API的响应
                    let datetimeStr = null;
                    if (data.datetime) {
                        datetimeStr = data.datetime;
                    } else if (data.dateTime) {
                        datetimeStr = data.dateTime;
                    } else if (data.date && data.time) {
                        datetimeStr = data.date + 'T' + data.time;
                    }
                    if (!datetimeStr) throw new Error('未识别的时间字段');
                    const serverTime = new Date(datetimeStr).getTime();
                    if (isNaN(serverTime)) throw new Error('时间解析失败');
                    return serverTime;
                } catch (e) {
                    clearTimeout(timeout);
                    throw e;
                }
            }

            async function syncNetworkTime() {
                updateSyncStatus('syncing', '正在校准网络时间…');
                let success = false;
                for (const apiUrl of TIME_APIS) {
                    try {
                        const serverTime = await tryFetchTime(apiUrl);
                        const clientTime = Date.now();
                        serverTimeOffset = serverTime - clientTime;
                        isTimeSynced = true;
                        updateSyncStatus('success', '已网络校准 · 每2分钟同步');
                        console.log('✅ 时间校准成功 (源: ' + apiUrl + ') 偏移: ' + serverTimeOffset + 'ms');
                        success = true;
                        break;
                    } catch (err) {
                        console.warn('⚠️ 尝试 ' + apiUrl + ' 失败: ' + err.message);
                    }
                }
                if (!success) {
                    if (isTimeSynced) {
                        updateSyncStatus('failed', '同步失败，继续使用上次校准值');
                    } else {
                        updateSyncStatus('failed', '所有时间源不可达，使用本地时间');
                        console.error('❌ 网络时间校准完全失败，使用客户端本地时间');
                    }
                }
                return success;
            }

            function startPeriodicSync() {
                if (syncTimer) clearInterval(syncTimer);
                syncTimer = setInterval(syncNetworkTime, SYNC_INTERVAL);
                if (!isTimeSynced) syncNetworkTime();
            }

            // 手动同步
            manualSyncBtn.addEventListener('click', (e) => {
                e.preventDefault();
                syncNetworkTime();
            });

            function updateClock() {
                const bjTime = getBeijingTime();
                const hours = bjTime.getHours();
                const minutes = bjTime.getMinutes();
                const seconds = bjTime.getSeconds();
                const year = bjTime.getFullYear();
                const month = bjTime.getMonth() + 1;
                const day = bjTime.getDate();
                const weekday = bjTime.getDay();

                if (seconds === lastSecond) {
                    requestAnimationFrame(() => scheduleNextUpdate());
                    return;
                }
                lastSecond = seconds;

                hoursEl.textContent = padTwo(hours);
                minutesEl.textContent = padTwo(minutes);
                secondsEl.textContent = padTwo(seconds);

                const dateStr = `${year}年${month}月${day}日`;
                if (dateDisplayEl.textContent !== dateStr) {
                    dateDisplayEl.textContent = dateStr;
                    weekdayDisplayEl.textContent = WEEKDAY_NAMES[weekday];
                    periodDisplayEl.textContent = getPeriod(hours);
                }

                requestAnimationFrame(() => scheduleNextUpdate());
            }

            let updateTimeout = null;
            function scheduleNextUpdate() {
                if (updateTimeout) clearTimeout(updateTimeout);
                const now = getBeijingTime();
                const msUntilNextSecond = 1000 - now.getMilliseconds();
                updateTimeout = setTimeout(updateClock, msUntilNextSecond + 1);
            }

            // 定时器管理 (无变化)
            function loadTimers() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed) && parsed.length === 8) return parsed;
                    }
                } catch (e) {}
                return JSON.parse(JSON.stringify(DEFAULT_TIMERS));
            }

            function saveTimers() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(currentTimers)); } catch (e) {}
            }

            function collectTimersFromDOM() {
                const cards = timersGrid.querySelectorAll('.timer-card');
                return Array.from(cards).map(card => {
                    const nameEl = card.querySelector('.timer-name');
                    const startEl = card.querySelector('.start-time');
                    const endEl = card.querySelector('.end-time');
                    return {
                        name: nameEl ? nameEl.textContent.trim() : '',
                        start: startEl ? startEl.textContent.trim() : '',
                        end: endEl ? endEl.textContent.trim() : ''
                    };
                });
            }

            function renderTimers(timers) {
                currentTimers = timers;
                timersGrid.innerHTML = '';
                timers.forEach(timer => {
                    const card = document.createElement('div');
                    card.className = 'timer-card';
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'timer-name';
                    nameSpan.contentEditable = 'false';
                    nameSpan.textContent = timer.name || '--';
                    const timeDiv = document.createElement('div');
                    timeDiv.className = 'timer-time';
                    const startSpan = document.createElement('span');
                    startSpan.className = 'start-time';
                    startSpan.contentEditable = 'false';
                    startSpan.textContent = timer.start || '--:--';
                    const sep = document.createElement('span');
                    sep.className = 'time-separator';
                    sep.textContent = '—';
                    const endSpan = document.createElement('span');
                    endSpan.className = 'end-time';
                    endSpan.contentEditable = 'false';
                    endSpan.textContent = timer.end || '--:--';
                    timeDiv.append(startSpan, sep, endSpan);
                    card.append(nameSpan, timeDiv);
                    timersGrid.appendChild(card);
                });
                attachBlurListeners();
            }

            function attachBlurListeners() {
                timersGrid.querySelectorAll('.timer-name, .start-time, .end-time').forEach(el => {
                    el.removeEventListener('blur', handleTimerBlur);
                    el.addEventListener('blur', handleTimerBlur);
                });
            }

            function handleTimerBlur() {
                currentTimers = collectTimersFromDOM();
                saveTimers();
            }

            function setEditingMode(editing) {
                isEditingTimers = editing;
                timersGrid.querySelectorAll('.timer-name, .start-time, .end-time').forEach(el => {
                    el.contentEditable = editing;
                });
                if (editing) {
                    body.classList.add('editing');
                    editIcon.textContent = '✓';
                    editLabel.textContent = '锁定';
                } else {
                    body.classList.remove('editing');
                    editIcon.textContent = '✎';
                    editLabel.textContent = '编辑';
                    currentTimers = collectTimersFromDOM();
                    saveTimers();
                }
                attachBlurListeners();
            }

            function toggleEditing() { setEditingMode(!isEditingTimers); }

            timersGrid.addEventListener('keydown', (e) => {
                if (!isEditingTimers) return;
                if (e.target.contentEditable === 'true' && e.key === 'Enter') {
                    e.preventDefault();
                    e.target.blur();
                }
            });

            // 全屏相关
            function enterFullscreen() {
                const el = document.documentElement;
                if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                else if (el.msRequestFullscreen) el.msRequestFullscreen();
            }
            function exitFullscreen() {
                if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
            function toggleFullscreen() { isFullscreen ? exitFullscreen() : enterFullscreen(); }
            function updateFullscreenUI(fs) {
                isFullscreen = fs;
                if (fs) {
                    fsIconEnter.style.display = 'none';
                    fsIconExit.style.display = 'block';
                    fullscreenLabel.textContent = '退出全屏';
                    body.classList.add('fullscreen-mode');
                } else {
                    fsIconEnter.style.display = 'block';
                    fsIconExit.style.display = 'none';
                    fullscreenLabel.textContent = '全屏';
                    body.classList.remove('fullscreen-mode');
                }
            }
            function onFullscreenChange() {
                updateFullscreenUI(!!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement));
            }
            document.addEventListener('fullscreenchange', onFullscreenChange);
            document.addEventListener('webkitfullscreenchange', onFullscreenChange);
            document.addEventListener('msfullscreenchange', onFullscreenChange);
            fullscreenBtn.addEventListener('click', (e) => { e.preventDefault(); toggleFullscreen(); });
            document.addEventListener('dblclick', (e) => {
                if (fullscreenBtn.contains(e.target) || editTimersBtn.contains(e.target) || manualSyncBtn.contains(e.target)) return;
                e.preventDefault();
                toggleFullscreen();
            });
            document.addEventListener('keydown', (e) => {
                if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    e.preventDefault(); toggleFullscreen();
                } else if (e.key === 'F11') { e.preventDefault(); toggleFullscreen(); }
            });

            function resetIdleTimer() {
                body.classList.remove('idle');
                if (idleTimer) clearTimeout(idleTimer);
                idleTimer = setTimeout(() => body.classList.add('idle'), 15000);
            }
            ['mousemove','touchstart','touchmove','keydown'].forEach(ev => document.addEventListener(ev, resetIdleTimer, {passive: true}));

            editTimersBtn.addEventListener('click', (e) => { e.preventDefault(); toggleEditing(); });

            // 初始化
            async function init() {
                const timers = loadTimers();
                renderTimers(timers);
                setEditingMode(false);

                await syncNetworkTime();
                startPeriodicSync();

                const bjTime = getBeijingTime();
                const hours = bjTime.getHours(), minutes = bjTime.getMinutes(), seconds = bjTime.getSeconds();
                hoursEl.textContent = padTwo(hours);
                minutesEl.textContent = padTwo(minutes);
                secondsEl.textContent = padTwo(seconds);
                lastSecond = seconds;
                dateDisplayEl.textContent = `${bjTime.getFullYear()}年${bjTime.getMonth()+1}月${bjTime.getDate()}日`;
                weekdayDisplayEl.textContent = WEEKDAY_NAMES[bjTime.getDay()];
                periodDisplayEl.textContent = getPeriod(hours);

                updateFullscreenUI(!!(document.fullscreenElement || document.webkitFullscreenElement));
                resetIdleTimer();
                scheduleNextUpdate();
            }

            init();

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) { if (updateTimeout) clearTimeout(updateTimeout); updateClock(); }
            });

            console.log('🕐 考场时钟已就绪 · 多源网络校准北京时间');
        })();
    </script>
</body>
</html>
